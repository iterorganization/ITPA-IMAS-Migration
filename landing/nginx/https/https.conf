# HTTPS server, for an F5 that forwards to the backend over HTTPS (443/TCP).
# Mounted into /etc/nginx/conf.d by docker-compose.https.yml, together with
# the certificate directory (LANDING_TLS_DIR, default /etc/itpea-landing/tls).

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/locations.conf;
}
