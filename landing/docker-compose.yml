services:
  landing:
    image: nginx:1.27-alpine
    container_name: itpea-landing
    environment:
      # SimDB dashboard and SimDB server, as published on the Docker host.
      DASHBOARD_HOST: ${DASHBOARD_HOST:-host.docker.internal}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-80}
      SIMDB_HOST: ${SIMDB_HOST:-host.docker.internal}
      SIMDB_PORT: ${SIMDB_PORT:-5000}
    ports:
      - "${LANDING_PORT:-8081}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
